---
- name: Check Homebrew is installed
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: homebrew_check

- name: Install Homebrew
  ansible.builtin.shell: |
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not homebrew_check.stat.exists
  changed_when: true

- name: Add Homebrew taps
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_taps }}"

- name: Install Homebrew packages
  community.general.homebrew:
    name: "{{ homebrew_packages }}"
    state: present
    update_homebrew: true

- name: Build OpenJDK package list for this Mac
  ansible.builtin.set_fact:
    homebrew_java_packages_for_host: >-
      {{
        homebrew_java_packages
        if ansible_architecture == 'x86_64'
        else homebrew_java_packages | reject('equalto', 'openjdk@8') | list
      }}

- name: Install OpenJDK packages
  community.general.homebrew:
    name: "{{ homebrew_java_packages_for_host }}"
    state: present
    update_homebrew: true
  when: homebrew_java_packages_for_host | length > 0

# pkg ベースの cask（Microsoft Office / docker-desktop / webex-meetings など）は
# インストール中に内部で sudo を呼ぶ。Ansible は非対話実行なので、become パスワードを
# sudo へ渡す askpass ヘルパを用意する。SUDO_ASKPASS が設定されていると Homebrew は
# sudo を -A 付きで呼び、このヘルパからパスワードを読み取る。
# パスワードはスクリプトに直接埋め込まず別ファイルに置き（$ などの特殊文字対策）、
# ヘルパはそれを cat するだけにする。vars_prompt が空ならこの仕組みは使わない。
- name: Create askpass work directory for pkg-based casks
  ansible.builtin.tempfile:
    state: directory
    suffix: askpass
  register: homebrew_cask_askpass
  when: ansible_become_password | default('') | length > 0

- name: Write sudo password file and askpass helper
  ansible.builtin.copy:
    dest: "{{ homebrew_cask_askpass.path }}/{{ item.name }}"
    mode: "{{ item.mode }}"
    content: "{{ item.content }}"
  loop:
    - name: secret
      mode: "0600"
      content: "{{ ansible_become_password }}"
    - name: askpass.sh
      mode: "0700"
      content: |
        #!/bin/sh
        cat '{{ homebrew_cask_askpass.path }}/secret'
  loop_control:
    label: "{{ item.name }}"
  when: ansible_become_password | default('') | length > 0
  no_log: true

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_casks }}"
  environment: >-
    {{
      {'SUDO_ASKPASS': homebrew_cask_askpass.path ~ '/askpass.sh'}
      if ansible_become_password | default('') | length > 0
      else {}
    }}
  ignore_errors: true

- name: Remove askpass work directory
  ansible.builtin.file:
    path: "{{ homebrew_cask_askpass.path | default('') }}"
    state: absent
  when: ansible_become_password | default('') | length > 0

- name: Get Homebrew prefix
  ansible.builtin.command: brew --prefix
  register: homebrew_prefix
  changed_when: false

- name: Add OpenJDK versions to jenv
  ansible.builtin.command: >
    jenv add {{ homebrew_prefix.stdout }}/opt/{{ item }}/libexec/openjdk.jdk/Contents/Home
  loop: "{{ homebrew_java_packages_for_host }}"
  register: homebrew_jenv_add_result
  changed_when: >
    'added' in homebrew_jenv_add_result.stdout
    or 'added' in homebrew_jenv_add_result.stderr
  failed_when: >
    homebrew_jenv_add_result.rc != 0
    and 'already' not in homebrew_jenv_add_result.stdout
    and 'already' not in homebrew_jenv_add_result.stderr
  when: homebrew_java_packages_for_host | length > 0
