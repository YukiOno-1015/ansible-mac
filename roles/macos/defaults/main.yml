---
macos_show_hidden_files: true
macos_show_all_filename_extensions: true
macos_disable_auto_correct: true
macos_key_repeat_rate: 2
macos_key_repeat_delay: 15
macos_dock_autohide: true
macos_dock_icon_size: 48
macos_screenshots_dir: "{{ ansible_env.HOME }}/Desktop/screenshots"
macos_hostname_manage: true
macos_hostname_device_name: ""
macos_hostname_purpose: ""
macos_hostname_serial_suffix_length: 0

# Internal LAN routes for sk4869.info (Cloudflare bypass)
macos_internal_dns_vip: "192.168.100.153"
macos_internal_dns_entries:
  - nexus-cli.sk4869.info
  - nexus-docker.sk4869.info
