---
# 普段使い用プロファイル
# 共通セット（group_vars/all.yml）+ コミュニケーション / エンタメ系のみ
# 開発系 CLI / Cask / MAS / Java / Xcode / Pleiades は dev プロファイルに統一

macos_hostname_purpose: OA
dotfiles_install_command: "./install.sh --restore-secrets"

# 普段使い専用の追加パッケージは無し（共通セットのみ使用）
# homebrew_packages は group_vars のデフォルト（homebrew_packages_common）を使用

homebrew_casks: "{{ homebrew_casks_common + homebrew_casks_personal_extra }}"
homebrew_casks_personal_extra:
  # コミュニケーション（Discord / Slack は共通へ移動済み）
  - thunderbird
  - webex
  - webex-meetings

mas_apps: "{{ mas_apps_common + mas_apps_personal_extra }}"
mas_apps_personal_extra:
  - id: 302584613
    name: "Kindle"
  - id: 539883307
    name: "LINE"
